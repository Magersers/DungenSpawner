name: DungenSpawner
version: 1.0.0
main: ru.dungenspawner.DungeonSpawnerPlugin
api-version: '1.21'
authors: [Codex]
softdepend: [WorldEdit, MobsRarity]
commands:
  spawndungeon:
    description: Spawn dungeon manually
    usage: /spawndungeon [rarity]
    permission: dungenspawner.admin
permissions:
  dungenspawner.admin:
    default: op
