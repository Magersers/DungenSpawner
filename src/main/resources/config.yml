# Мир, в котором будут появляться данжи.
world: world
# Путь до schematic-файла данжа.
schematic-path: plugins/WorldEdit/schematics/simple-church.schematic
# Координата X центра зоны спавна данжей.
spawn-center-x: 0
# Координата Z центра зоны спавна данжей.
spawn-center-z: 0
# Радиус (в блоках) вокруг центра, где может появиться данж.
spawn-radius: 2500
# Максимальное количество одновременно активных данжей.
max-active-dungeons: 5
# Время жизни одного данжа в секундах.
dungeon-lifetime-seconds: 600

# Настройки количества автоматически создаваемых данжей в сутки.
daily-spawns:
  # Минимум автоспавнов данжей за сутки.
  min: 2
  # Максимум автоспавнов данжей за сутки.
  max: 3

# Минимальное количество мобов в одном данже.
mobs-per-dungeon-min: 10
# Максимальное количество мобов в одном данже.
mobs-per-dungeon-max: 15

# Порядок редкостей (используется для логики и перехода к следующей редкости босса).
rarity-order:
  # Базовая редкость.
  - common
  # Необычная редкость.
  - uncommon
  # Редкая редкость.
  - rare
  # Эпическая редкость.
  - epic
  # Легендарная редкость.
  - legendary
  # Максимальная редкость.
  - god

# Вес шанса появления данжа каждой редкости (чем больше число, тем чаще спавн).
rarity-spawn-weights:
  # Вес спавна для common.
  common: 45
  # Вес спавна для uncommon.
  uncommon: 30
  # Вес спавна для rare.
  rare: 15
  # Вес спавна для epic.
  epic: 7
  # Вес спавна для legendary.
  legendary: 2
  # Вес спавна для god.
  god: 1

# Список типов мобов по каждой редкости данжа.
rarity-mobs:
  # Мобы для common-данжа.
  common: [ZOMBIE, SKELETON]
  # Мобы для uncommon-данжа.
  uncommon: [SKELETON, SPIDER]
  # Мобы для rare-данжа.
  rare: [HUSK, STRAY]
  # Мобы для epic-данжа.
  epic: [WITHER_SKELETON, BOGGED]
  # Мобы для legendary-данжа.
  legendary: [BLAZE, PIGLIN_BRUTE]
  # Мобы для god-данжа.
  god: [WARDEN, EVOKER]

# Награда в SHARDS за полную зачистку данжа по его редкости.
rarity-clear-rewards:
  # Награда за зачистку common-данжа.
  common: 25
  # Награда за зачистку uncommon-данжа.
  uncommon: 40
  # Награда за зачистку rare-данжа.
  rare: 60
  # Награда за зачистку epic-данжа.
  epic: 90
  # Награда за зачистку legendary-данжа.
  legendary: 130
  # Награда за зачистку god-данжа.
  god: 200

# Префикс сообщений плагина в чате.
announce-prefix: "§6[Данжи] §r"
# Количество шагов постепенного разрушения/восстановления области данжа.
decay-steps: 20
# Интервал между шагами разрушения/восстановления в тиках.
decay-interval-ticks: 40
